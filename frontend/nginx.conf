server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le Service Worker ne doit jamais etre servi depuis un cache navigateur :
    # sinon une mise a jour de l'application n'atteint jamais les postes.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : toute route inconnue retourne index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
