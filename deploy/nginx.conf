# Nginx en frontal : TLS, fichiers statiques, proxy vers l'API.
# Le televersement de leves topographiques impose des limites genereuses.

upstream api_dcuhat {
    server api:8000;
}

server {
    listen 80;
    server_name dcuhat.lambayin.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dcuhat.lambayin.local;

    ssl_certificate     /etc/nginx/certs/dcuhat.crt;
    ssl_certificate_key /etc/nginx/certs/dcuhat.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Un leve topographique peut peser plusieurs centaines de Mo.
    client_max_body_size 2048M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass http://api_dcuhat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # televersement fragmente en flux
    }

    location /admin/ {
        proxy_pass http://api_dcuhat;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/dcuhat/static/;
        expires 30d;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
